<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teatro Memory Coach</title>
    <!-- Il file script.js deve definire: const scriptData = {...} -->
    <script src="script.js"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e67e22;
            --light: #ecf0f1;
            --danger: #c0392b;
            --success: #27ae60;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); color: var(--primary); display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .container { max-width: 600px; width: 100%; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-top: 20px; }
        h1 { text-align: center; margin-bottom: 10px; font-size: 1.5rem; }
        #scene-title { text-align: center; color: #7f8c8d; font-size: 1rem; margin-bottom: 20px; border-bottom: 2px solid var(--light); padding-bottom: 10px; }
        .section { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        select, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem; }
        button { cursor: pointer; transition: opacity 0.2s; font-weight: bold; border: none; }
        button:hover { opacity: 0.9; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        #display-area { min-height: 180px; background: #fdfdfd; border: 2px solid #eee; border-radius: 12px; padding: 25px; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 15px 0; }
        .speaker-name { font-weight: bold; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; font-size: 0.9rem; }
        .line-text { font-size: 1.3rem; line-height: 1.6; font-style: italic; }
        .cue { color: var(--danger); font-weight: bold; animation: blink 1.5s infinite; font-style: normal; }
        
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <h1 id="script-title">🎭 Memory Coach</h1>
    <div id="scene-title">Seleziona una scena per iniziare</div>

    <!-- Schermata Iniziale: Setup -->
    <div id="setup-controls">
        <div class="section">
            <label for="sceneSelect">Atto e Scena</label>
            <select id="sceneSelect"></select>
            
            <label for="charSelect">Il Tuo Personaggio</label>
            <select id="charSelect"></select>
            
            <button onclick="startStudy()" style="background: var(--success); color: white; margin-top: 10px;">Inizia Studio</button>
        </div>
    </div>

    <!-- Schermata Player: Studio -->
    <div id="player" class="hidden">
        <div id="display-area">
            <div id="speaker" class="speaker-name"></div>
            <div id="content" class="line-text"></div>
        </div>
        
        <div class="btn-group">
            <button onclick="prevLine()" style="background: #95a5a6; color: white;">⬅ Indietro</button>
            <button onclick="nextLine()" style="background: var(--primary); color: white;">Avanti ➡</button>
        </div>

        <div id="hints-area" class="btn-group" style="margin-top:10px;">
            <button id="suggestBtn" onclick="suggestWord()" style="background: var(--accent); color: white;">Suggerisci (S)</button>
            <button id="toggleBtn" onclick="toggleFullLine()" style="background: #3498db; color: white;">Mostra Tutto (H)</button>
        </div>

        <button onclick="resetSetup()" style="background: none; color: #7f8c8d; border: 1px solid #ccc; margin-top: 20px;">Cambia Scena o Personaggio</button>
    </div>
</div>

<script>
    // --- Stato dell'Applicazione ---
    let currentAttoIdx = 0;
    let currentScenaIdx = 0;
    let currentIndex = 0;
    let currentLines = [];
    let myChar = "";
    
    // Flag per i suggerimenti
    let revealedWords = 0;
    let isLineVisible = false;
    let currentAudio = null;

    // --- Inizializzazione ---
    window.onload = () => {
        if (typeof scriptData !== 'undefined') {
            document.getElementById('script-title').textContent = "🎭 " + (scriptData.titolo || "Memory Coach");
            populateSetup();
        } else {
            alert("Errore: script.js non trovato. Assicurati che il file script.js sia nella stessa cartella dell'indice.");
        }
    };

    function populateSetup() {
        const sceneSelect = document.getElementById('sceneSelect');
        sceneSelect.innerHTML = '';
        
        scriptData.atti.forEach((atto, aIdx) => {
            atto.scene.forEach((scena, sIdx) => {
                const opt = document.createElement('option');
                opt.value = `${aIdx}-${sIdx}`;
                opt.textContent = `${atto.titolo} - ${scena.titolo}`;
                sceneSelect.appendChild(opt);
            });
        });

        sceneSelect.addEventListener('change', updateCharacterList);
        updateCharacterList();
    }

    function updateCharacterList() {
        const sceneSelect = document.getElementById('sceneSelect');
        const charSelect = document.getElementById('charSelect');
        const [aIdx, sIdx] = sceneSelect.value.split('-').map(Number);
        
        // Estrae personaggi unici dalla scena selezionata
        const scene = scriptData.atti[aIdx].scene[sIdx];
        const personaggi = [...new Set(scene.battute.flatMap(b => b.personaggi))];

        charSelect.innerHTML = '<option value="LETTURA_LIBERA">📖 Lettura Libera (Tutte le voci)</option>';
        personaggi.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p; opt.textContent = p;
            charSelect.appendChild(opt);
        });
    }

    function startStudy() {
				const [aIdx, sIdx] = document.getElementById('sceneSelect').value.split('-').map(Number);
				currentAttoIdx = aIdx;
				currentScenaIdx = sIdx;
				myChar = document.getElementById('charSelect').value;
				
				// RESET DELL'INDICE alla prima battuta
				currentIndex = 0; 
				
				loadCurrentScene();
				
				document.getElementById('setup-controls').classList.add('hidden');
				document.getElementById('player').classList.remove('hidden');
				
				renderLine();
		}

    // --- Logica Core ---

    function loadCurrentScene() {
        currentLines = scriptData.atti[currentAttoIdx].scene[currentScenaIdx].battute;
        const scenaTitolo = scriptData.atti[currentAttoIdx].scene[currentScenaIdx].titolo;
        const attoTitolo = scriptData.atti[currentAttoIdx].titolo;
        document.getElementById('scene-title').textContent = `${attoTitolo} • ${scenaTitolo}`;
    }

    function playLocalAudio() {
        const line = currentLines[currentIndex];
        
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.currentTime = 0;
        }

        if (line.hash) {
            const audioPath = `audio/${line.hash}.mp3`;
            currentAudio = new Audio(audioPath);
            currentAudio.play().catch(e => console.log("Audio non trovato:", audioPath));
        }
    }

    function renderLine() {
				if (currentIndex >= currentLines.length) currentIndex = 0;
				if (currentIndex < 0) currentIndex = 0;
        const line = currentLines[currentIndex];
        const speakerEl = document.getElementById('speaker');
        const contentEl = document.getElementById('content');
        const hintsArea = document.getElementById('hints-area');
        
        // Reset stati suggerimento
        revealedWords = 0;
        isLineVisible = false;
        document.getElementById('toggleBtn').textContent = "Mostra Tutto (H)";

        speakerEl.textContent = line.personaggi.join(" & ");

        const iAmSpeaking = line.personaggi.includes(myChar);

        if (myChar !== "LETTURA_LIBERA" && iAmSpeaking) {
            // TURNO UTENTE
            if (currentAudio) currentAudio.pause();
            contentEl.innerHTML = `<span class="cue">TOCCA A TE!</span>`;
            hintsArea.classList.remove('hidden');
        } else {
            // TURNO AI
            contentEl.textContent = `"${line.testo}"`;
            hintsArea.classList.add('hidden');
            playLocalAudio();
        }
    }

    // --- Navigazione ---

    function nextLine() {
				if (currentIndex < currentLines.length - 1) {
				    // Avanti normale
				    currentIndex++;
				    renderLine();
				} else {
				    // Tentativo di cambio scena automatico
				    const atti = scriptData.atti;
				    if (currentScenaIdx < atti[currentAttoIdx].scene.length - 1) {
				        // Nuova scena stesso atto
				        currentScenaIdx++;
				        currentIndex = 0; // RESET FONDAMENTALE
				        loadCurrentScene();
				        renderLine();
				    } else if (currentAttoIdx < atti.length - 1) {
				        // Nuovo atto, prima scena
				        currentAttoIdx++;
				        currentScenaIdx = 0;
				        currentIndex = 0; // RESET FONDAMENTALE
				        loadCurrentScene();
				        renderLine();
				    } else {
				        alert("Fine del copione!");
				    }
				}
		}

		function prevLine() {
				if (currentIndex > 0) {
				    // Indietro normale
				    currentIndex--;
				    renderLine();
				} else {
				    // Tentativo di tornare alla scena precedente
				    if (currentScenaIdx > 0) {
				        currentScenaIdx--;
				        loadCurrentScene();
				        // Se torniamo indietro di una scena, vogliamo andare all'ULTIMA battuta
				        currentIndex = currentLines.length - 1; 
				        renderLine();
				    } else if (currentAttoIdx > 0) {
				        currentAttoIdx--;
				        currentScenaIdx = scriptData.atti[currentAttoIdx].scene.length - 1;
				        loadCurrentScene();
				        currentIndex = currentLines.length - 1;
				        renderLine();
				    }
				}
		}

    // --- Funzioni di Aiuto ---

    function suggestWord() {
        const fullText = currentLines[currentIndex].testo;
        const words = fullText.split(/\s+/);
        if (revealedWords < words.length) {
            revealedWords++;
            const partial = words.slice(0, revealedWords).join(" ");
            document.getElementById('content').innerHTML = `<span style="color:var(--success)">${partial}</span>${revealedWords < words.length ? '...' : ''}`;
        }
    }

    function toggleFullLine() {
        const contentEl = document.getElementById('content');
        const toggleBtn = document.getElementById('toggleBtn');
        const fullText = currentLines[currentIndex].testo;

        if (!isLineVisible) {
            contentEl.innerHTML = `<span style="color:var(--primary)">${fullText}</span>`;
            toggleBtn.textContent = "Nascondi (H)";
            isLineVisible = true;
        } else {
            contentEl.innerHTML = `<span class="cue">TOCCA A TE!</span>`;
            toggleBtn.textContent = "Mostra Tutto (H)";
            isLineVisible = false;
            revealedWords = 0;
        }
    }

    function resetSetup() {
        if (currentAudio) currentAudio.pause();
        document.getElementById('player').classList.add('hidden');
        document.getElementById('setup-controls').classList.remove('hidden');
        document.getElementById('scene-title').textContent = "Seleziona una scena per iniziare";
    }

    // --- Tastiera ---
    document.addEventListener('keydown', (e) => {
        if (document.getElementById('player').classList.contains('hidden')) return;
        
        switch(e.key.toLowerCase()) {
            case "arrowright": case " ": e.preventDefault(); nextLine(); break;
            case "arrowleft": prevLine(); break;
            case "s": suggestWord(); break;
            case "h": toggleFullLine(); break;
        }
    });
</script>

</body>
</html>
